name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release, tagging this commit v<version>-<buildVersion> from mygo.json
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal DMG
            os: macos-latest
            platform: darwin/universal
            artifact: macos
            path: build/darwin-universal/*.dmg
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check release version
        id: version
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path("mygo.json").read_text(encoding="utf-8"))
          version = config["version"]
          build = config["buildVersion"]
          if type(build) is not int or build < 0:
              raise SystemExit("mygo.json buildVersion must be a nonnegative integer")
          expected = f"v{version}-{build}"
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              tag = os.environ["GITHUB_REF_NAME"]
              if tag != expected:
                  raise SystemExit(f"Tag {tag} must match mygo.json release {expected}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tag={expected}\n")
          PY
      - name: Validate
        run: |
          go test ./...
          go vet ./...
          go tool mygo vet
      # adb, scrcpy and scrcpy-server from scrcpy's official macOS release,
      # checked against their SHA-256.
      - name: Bundle ADB and scrcpy
        run: ./scripts/fetch-scrcpy.sh
      # Publishing belongs to the release job; these builds need no signing secrets.
      - name: Build installer
        run: go tool mygo build -platform "${{ matrix.platform }}" -sign=- -skip-notarize
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # The pushed tag.
            gh release create "$TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG" \
              --notes ''
          else
            # Run by hand: tag the commit the build ran on.
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "Release $TAG already exists: bump buildVersion in mygo.json" >&2
              exit 1
            fi
            gh release create "$TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes ''
          fi
